name: Vegan News Agent

on:
  schedule:
    # Every Friday at 10am UTC
    - cron: '0 10 * * 5'
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/vegan-news-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/vegan-news-agent/requirements.txt

      - name: Run agent
        id: agent
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.VEGAN_NEWS_PAT }}
        run: |
          python scripts/vegan-news-agent/news_agent.py 2>&1 | tee /tmp/agent-output.txt
          PR_URL=$(grep -oP 'https://github.com/[^/]+/[^/]+/pull/\d+' /tmp/agent-output.txt | tail -1 || true)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          PR_NUM=$(echo "$PR_URL" | grep -oP '\d+$' || true)
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Wait for Vercel deployment
        id: vercel
        if: ${{ steps.agent.outputs.pr_url != '' }}
        run: |
          echo "Waiting for Vercel to deploy the preview..."
          for i in $(seq 1 36); do
            # Get the latest Preview deployment's environment URL
            PREVIEW_URL=$(gh api repos/peterdonaghey/vegan-hearts/deployments \
              --jq '[.[] | select(.environment == "Preview")][0] | .statuses_url' \
              | head -1 | xargs -I{} gh api {} --jq '.[0].environment_url' 2>/dev/null || true)
            if [ -n "$PREVIEW_URL" ] && [ "$PREVIEW_URL" != "null" ]; then
              echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
              echo "Found: $PREVIEW_URL"
              PR_NUM="${{ steps.agent.outputs.pr_number }}"
              gh pr comment "$PR_NUM" -R peterdonaghey/vegan-hearts \
                --body "🌐 **Vercel Preview:** [$PREVIEW_URL]($PREVIEW_URL)"
              exit 0
            fi
            echo "Waiting... ($i/36)"
            sleep 10
          done
          echo "No preview deployment found after 6 minutes"
          echo "url=" >> "$GITHUB_OUTPUT"

      - name: Check SMTP secret
        id: check_smtp
        run: |
          if [ -n "${{ secrets.SMTP_PASSWORD }}" ]; then
            echo "has_smtp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_smtp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notification email
        if: ${{ steps.agent.outputs.pr_url != '' && steps.check_smtp.outputs.has_smtp == 'true' }}
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: donagheypeter@gmail.com
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Vegan News Agent
          to: donagheypeter@googlemail.com
          subject: "🌱 New good-news article ready for review"
          body: |
            A new article was found and added to the GoodNews feed.

            📝 PR: ${{ steps.agent.outputs.pr_url }}
            🌐 Preview: ${{ steps.vercel.outputs.url }}

            Open the PR to review and merge.
