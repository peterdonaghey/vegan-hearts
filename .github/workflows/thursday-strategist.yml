name: Thursday Strategist

on:
  schedule:
    - cron: '0 13 * * 4'   # Thursday 1pm UTC
  workflow_dispatch:

jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/vegan-news-agent/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/vegan-news-agent/requirements.txt
      - name: Run strategist
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.VEGAN_NEWS_PAT }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "🧠 Thursday Strategist — coming soon"
          echo "Synthesises the week, sends you ideas and questions via email"
