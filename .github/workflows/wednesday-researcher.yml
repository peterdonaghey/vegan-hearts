name: Wednesday Researcher

on:
  schedule:
    - cron: '0 12 * * 3'   # Wednesday 12pm UTC
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/vegan-news-agent/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/vegan-news-agent/requirements.txt
      - name: Run researcher
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.VEGAN_NEWS_PAT }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "🌍 Wednesday Researcher — coming soon"
          echo "Explores one topic area the feed is missing, adds search queries or source lists"
