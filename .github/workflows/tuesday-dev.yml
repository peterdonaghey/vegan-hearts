name: Tuesday Developer

on:
  schedule:
    - cron: '0 12 * * 2'   # Tuesday 12pm UTC
  workflow_dispatch:

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/vegan-news-agent/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/vegan-news-agent/requirements.txt
      - name: Run dev agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.VEGAN_NEWS_PAT }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "🔧 Tuesday Developer — coming soon"
          echo "Reads Monday's critique, makes one small code improvement, creates PR"
