name: Monday Critic

on:
  schedule:
    - cron: '0 12 * * 1'   # Monday 12pm UTC
  workflow_dispatch:

jobs:
  critic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/vegan-news-agent/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/vegan-news-agent/requirements.txt
      - name: Run critic
        env:
          GITHUB_TOKEN: ${{ secrets.VEGAN_NEWS_PAT }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python scripts/vegan-news-agent/critic_agent.py
